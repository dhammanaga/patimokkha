<h1>📖 前4章（事前任务/序诵/巴拉基咖/僧始终）逐句试听</h1>
<div class="note">硬刷新 Ctrl+Shift+R 后点任意句子播放。目标：核对每句末尾是否完整（末词尾音/拖腔是否被切），以及开头是否含齐。请试听并告知哪些句末尾听来不完整。</div>

<script>
const DATA = {"0": {"pali": "Namo tassa bhagavato arahato sammāsambuddhassa", "zh": "礼敬那位跋葛瓦，阿拉汉，正自觉者！（三遍）"}, "1": {"pali": "Sammajjanī, padīpo ca, udakaṃ āsanena ca, uposathassa (pavāraṇāya) etāni ‘pubbakaraṇan’ti vuccati.", "zh": "扫帚以及灯，水以及座位，这些称为伍波思特（邀请）的“事前任务”。"}, "2": {"pali": "Iti aṭṭhakathācariyehi vuttattā.", "zh": "这是诸义註师所说。"}, "3": {"pali": "Sammajjana-karaṇaṃ niṭṭhitaṃ.", "zh": "扫地的任务已完成。"}, "4": {"pali": "Padīpujjalanaṃ niṭṭhitaṃ.", "zh": "（无阳光）灯已经点亮了。"}, "5": {"pali": "Idāni pana suriyālokassa atthitāya padīpakiccaṃ idha natthi.", "zh": "（有阳光）现在有阳光，在此无需点灯的工作。"}, "6": {"pali": "Āsanena saha pānīya-paribhojanīya-udakaṭṭhapanaṃ niṭṭhitaṃ.", "zh": "座位以及饮用、洗用之水都已经放置好了。"}, "7": {"pali": "Etāni cattāri vattāni sammajjanakaraṇādīni saṅghasannipātato paṭhamaṃ kattabbattā.", "zh": "扫地任务等这四项义务，是僧团为了伍波思特（邀请）而首先应当做的。"}, "8": {"pali": "‘Uposathassa uposathakammassa (pavāraṇāya pavāraṇākammassa) pubbakaraṇan’ti vuccati.", "zh": "故被称为伍波思特甘马（邀请甘马）的“事前任务”。"}, "9": {"pali": "Pubbakaraṇānī’ti akkhātāni.", "zh": "“事前任务”已经宣告了。"}, "10": {"pali": "Chanda-pārisuddhi (pavāraṇā)-utukkhānaṃ, bhikkhugaṇanā ca ovādo, uposathassa (pavāraṇāya) etāni ‘pubbakiccan’ti vuccati.", "zh": "意欲、清净（邀请）、季节宣告、比库人数以及教诲，这些称为伍波思特（邀请）的“事前工作”。"}, "11": {"pali": "Iti aṭṭhakathācariyehi vuttattā.", "zh": "这是诸义註师所说。"}, "12": {"pali": "Ayaṃ sīmā khaṇḍasīmā, na mahāsīmā, na gāmasīmā.", "zh": "（在划定界）此界是划定界，不是大界，不是村界。"}, "13": {"pali": "Tasmā chanda-pārisuddhi (pavāraṇā)-āharaṇaṃ idha natthi.", "zh": "所以这里不用带来意欲、清净（邀请）。"}, "14": {"pali": "Chandāharaṇa pārisuddhi (pavāraṇā)-āharaṇāni pana imissaṃ sīmāyaṃ hatthapāsaṃ vijahitvā nisinnānaṃ bhikkhūnaṃ abhāvato natthi.", "zh": "（在大界、村界）不用带来意欲和带来清净（邀请），因为在此界内并没有坐在伸手所及处之外的比库。"}, "15": {"pali": "Utūnīdha pana sāsane hemanta-gimha-vassānānaṃ vasena tīṇi honti.", "zh": "在此教法中有凉季、热季和雨季三季。"}, "16": {"pali": "Ayaṃ hemanta-utu (gimha-utu / vassāna-utu).", "zh": "这时是凉季（热季/雨季）。"}, "17": {"pali": "Asmiṃ utumhi aṭṭha (dasa) uposathā.", "zh": "在这个季节里有八次（十次）伍波思特。"}, "18": {"pali": "Iminā pakkhena eko uposatho sampatto, tayo uposathā atikkantā, cattāro uposathā avasiṭṭhā.", "zh": "于这个半月，一次伍波思特已到来，三次伍波思特已经过去，还剩下四次伍波思特。"}, "19": {"pali": "Imasmiṃ pana uposathagge (pavāraṇagge) sannipatitānaṃ bhikkhūnaṃ gaṇanā cattāro bhikkhū honti.", "zh": "在此伍波思特堂（邀请堂）集合的比库人数有四位比库。"}, "20": {"pali": "Bhikkhunīnamovādo pana idāni tāsaṃ natthitāya natthi.", "zh": "教诲比库尼因现在她们已不复存在故不用。"}, "21": {"pali": "Etāni pañcakammāni chandāharaṇādīni pātimokkhuddesato (pavāraṇākammato) paṭhamaṃ kattabbattā.", "zh": "带来意欲等这五项工作，是为了伍波思特而诵巴帝摩卡（邀请甘马）首先应当做的。"}, "22": {"pali": "‘Uposathassa uposathakammassa (pavāraṇāya pavāraṇākammassa) pubbakiccan’ti vuccati.", "zh": "故被称为伍波思特甘马（邀请甘马）的“事前工作”。"}, "23": {"pali": "Pubbakiccānī’ti akkhātāni.", "zh": "“事前工作”已经宣告了。"}, "24": {"pali": "Uposatho (pavāraṇā) yāvatikā ca bhikkhū kammappattā sabhāgāpattiyo ca na vijjanti, vajjanīyā ca puggalā tasmiṃ na honti, ‘pattakallan’ti vuccati.", "zh": "伍波思特（邀请）与多少比库参加甘马，以及不存在同分罪，这里没有应被遣出之人，称为“已到适时”。"}, "25": {"pali": "Iti aṭṭhakathācariyehi vuttattā.", "zh": "这是诸义註师所说。"}, "26": {"pali": "Divasavasena tīsu uposathesu (pavāraṇāsu), cātuddasī-pannarasī-sāmaggīsu, ajjuposatho pannaraso / cātuddaso (ajja pavāraṇā pannarasī).", "zh": "在三种伍波思特（邀请）日中，有十四日、十五日与和合日，今天的伍波思特是十五日/十四日（今天的邀请是十五日）。"}, "27": {"pali": "Kāraṇapuggalavasena tīsu uposathesu, saṅgha-gaṇa-puggala-uposathesu, ajjuposatho saṅgha-uposatho (pavāraṇāsu, saṅgha-gaṇa-puggala-pavāraṇāsu, ajja pavāraṇā saṅgha-pavāraṇā).", "zh": "依所作之人的三种伍波思特中，有僧团、小众和个人伍波思特，今天的伍波思特是僧团伍波思特（邀请中，有僧团、小众和个人邀请，今天的邀请是僧团邀请）。"}, "28": {"pali": "Kātabbākāravasena tīsu uposathesu, suttuddesa-pārisuddhi-adhiṭṭhāna-uposathesu, ajjuposatho suttuddesa-uposatho (pavāraṇāsu, saṅgha-aññamañña-adhiṭṭhāna-pavāraṇāsu, ajja pavāraṇā saṅgha-pavāraṇā).", "zh": "依应作行相的三种伍波思特中，有诵[戒]经、清净和决意伍波思特，今天的伍波思特是诵[戒]经伍波思特（邀请中，有僧团、互相和决意邀请，今天的邀请是僧团邀请）。"}, "29": {"pali": "Yattakā bhikkhū tassa uposathakammassa (pavāraṇākammassa), pattā yuttā anurūpā, sabbantimena paricchedena cattāro (pañca) bhikkhū pakatattā, saṅghena anukkhittā, te ca kho hatthapāsaṃ avijahitvā ekasīmāyaṃ ṭhitā.", "zh": "凡是参加该伍波思特甘马（邀请甘马）的比库们是适当、合适的，至少限定为未被僧团检举的四位（五位）合格比库，而且他们处于同一界内，不分离于伸手所及之处。"}, "30": {"pali": "Tesaṃ vikāla-bhojanādi-vatthu-sabhāgāpattiyo ca na vijjanti.", "zh": "他们不存在[全部违犯]非时食等事的同分罪。"}, "31": {"pali": "Gahaṭṭha-paṇḍakādayo ekavīsati vajjanīyā-puggalā hatthapāsato bahikaraṇavasena vajjetabbā, te asmiṃ na honti.", "zh": "在家人、般哒格等二十一种应被遣出之人必须被遣出于伸手所及处之外。他们并不在这里。"}, "32": {"pali": "Saṅghassa uposathakammaṃ (pavāraṇākammaṃ) imehi catūhi lakkhaṇehi saṅgahitaṃ ‘pattakallan’ti vuccati.", "zh": "僧团的伍波思特甘马（邀请甘马）由这四种特相构成，称为“已到适时”。"}, "33": {"pali": "Pattakālavantan’ti akkhātaṃ.", "zh": "“已到适时”已经宣告了。"}, "34": {"pali": "Pubbakaraṇa-pubbakiccāni samāpetvā desitāpattikassa samaggassa bhikkhusaṅghassa anumatiyā pātimokkhaṃ uddisituṃ (pavāraṇā ñattiṃ) ārādhanaṃ karoma.", "zh": "完成了事前任务和事前工作，在已忏罪、和合的比库僧团的同意下，我们提出邀请诵巴帝摩卡（邀请提案）。"}, "35": {"pali": "Sādhu! Sādhu! Sādhu!", "zh": "萨度！萨度！萨度！"}, "36": {"pali": "Suṇātu me bhante saṅgho", "zh": "尊者们，请僧团听我[说]，"}, "37": {"pali": "Ajjuposatho pannaraso", "zh": "今天是十五日伍波萨他。"}, "38": {"pali": "yadi saṅghassa pattakallaṃ", "zh": "如果僧团已到适时，"}, "39": {"pali": "saṅgho uposathaṃ kareyya", "zh": "僧团应举行伍波萨他，"}, "40": {"pali": "pātimokkhaṃ uddiseyya", "zh": "诵巴帝摩卡。"}, "41": {"pali": "Kiṃ saṅghassa pubbakiccaṃ", "zh": "什么是僧团的事前义务？"}, "42": {"pali": "Pārisuddhiṃ āyasmanto ārocetha", "zh": "请具寿们告知清净，"}, "43": {"pali": "pātimokkhaṃ uddisissāmi", "zh": "我将诵巴帝摩卡。"}, "44": {"pali": "taṃ sabbeva santā sādhukaṃ", "zh": "请一切在场者对此好好"}, "45": {"pali": "suṇoma manasi karoma", "zh": "倾听、作意！"}, "46": {"pali": "Yassa siyā āpatti so āvikareyya", "zh": "凡是有罪者，他应当发露；"}, "47": {"pali": "asantiyā āpattiyā tuṇhī bhavitabbaṃ", "zh": "没有罪者应当沉默。"}, "48": {"pali": "tuṇhībhāvena kho panāyasmante", "zh": "因为沉默，就具寿们而言"}, "49": {"pali": "parisuddhā ti vedissāmi", "zh": "我将认为是“清净的”。"}, "50": {"pali": "Yathā kho pana pacceka-puṭṭhassa", "zh": "正如对单一的问题"}, "51": {"pali": "veyyākaraṇaṃ hoti", "zh": "有所回答。"}, "52": {"pali": "evamevaṃ evarūpāya parisāya", "zh": "同样地，在如此之众中"}, "53": {"pali": "yāvatatiyaṃ anusāvitaṃ hoti", "zh": "有乃至第三次的告知。"}, "54": {"pali": "Yo pana bhikkhu yāvatatiyaṃ anusāviyamāne", "zh": "任何比库在乃至第三次的告知时，"}, "55": {"pali": "saramāno santiṃ āpattiṃ nāvikareyya", "zh": "若记得有罪而不发露者，"}, "56": {"pali": "sampajāna-musāvādassa hoti", "zh": "则为故意妄语。"}, "57": {"pali": "Sampajāna-musāvādo kho panāyasmanto", "zh": "具寿们，故意妄语"}, "58": {"pali": "antarāyiko dhammo vutto bhagavatā", "zh": "被世尊说成是障碍法。"}, "59": {"pali": "tasmā saramānena bhikkhunā", "zh": "因此，记得的比库"}, "60": {"pali": "āpannena visuddhāpekkhena", "zh": "希望所犯清净"}, "61": {"pali": "santī āpatti āvikātabbā", "zh": "有罪应当发露，"}, "62": {"pali": "āvikatā hissa phāsu hoti", "zh": "发露了实是他的安乐。"}, "63": {"pali": "Uddiṭṭhaṃ kho āyasmanto nidānaṃ", "zh": "具寿们，已经诵出[戒]序。"}, "64": {"pali": "Tatthāyasmante pucchāmi kaccittha parisuddhā", "zh": "在此我问诸具寿:“于此是否清净？”"}, "65": {"pali": "dutiyampi pucchāmi kaccittha parisuddhā", "zh": "第二次我再问:“于此是否清净？”"}, "66": {"pali": "tatiyampi pucchāmi kaccittha parisuddhā", "zh": "第三次我再问:“于此是否清净？”"}, "67": {"pali": "parisuddhetthāyasmanto", "zh": "于此诸具寿是清净的，"}, "68": {"pali": "tasmā tuṇhī evametaṃ dhārayāmīti", "zh": "因此默然。此事我如此[忆]持。"}, "69": {"pali": "Nidānuddeso paṭhamo.", "zh": "序诵第一"}, "70": {"pali": "Sutā kho panāyasmantehi", "zh": "以下已被具寿们所听闻"}, "71": {"pali": "cattāro pārājikā dhammā", "zh": "四巴拉基咖"}, "72": {"pali": "terasa saṅghādisesā dhammā", "zh": "十三僧始终"}, "73": {"pali": "dve aniyatā dhammā", "zh": "二不定法"}, "74": {"pali": "tiṃsa nissaggiyā pācittiyā dhammā", "zh": "三十舍堕法"}, "75": {"pali": "dvenavuti pācittiyā dhammā", "zh": "九十二巴吉帝亚"}, "76": {"pali": "cattāro pāṭidesanīyā dhammā", "zh": "四应悔过"}, "77": {"pali": "sekhiyā dhammā", "zh": "应学法"}, "78": {"pali": "satta adhikaraṇasamathā dhammā", "zh": "七止诤法"}, "79": {"pali": "avivadamānehi sikkhitabbaṃ", "zh": "应被无争议者学修。"}, "80": {"pali": "Tatrime cattāro pārājikādhammā uddesaṃ āgacchanti", "zh": "于此，诵出此四巴拉基咖法来。"}, "81": {"pali": "Yo pana bhikkhu bhikkhūnaṃ sikkhā-sājīva-samāpanno", "zh": "若比库得到诸比库之学与生活规则，"}, "82": {"pali": "sikkhaṃ appaccakkhāya dubbalyaṃ anāvikatvā", "zh": "未舍弃学，没有表明羸弱"}, "83": {"pali": "methunaṃ dhammaṃ paṭiseveyya", "zh": "而从事淫欲法者，"}, "84": {"pali": "antamaso tiracchāna-gatāyapi", "zh": "乃至与畜生，"}, "85": {"pali": "pārājiko hoti asaṃvāso", "zh": "也是巴拉基咖，不共住。"}, "86": {"pali": "Yo pana bhikkhu gāmā vā araññā vā", "zh": "若比库在村落或林野，"}, "87": {"pali": "adinnaṃ theyya-saṅkhātaṃ ādiyeyya", "zh": "以盗心不与而取，"}, "88": {"pali": "yathārūpe adinnādāne rājāno coraṃ gahetvā", "zh": "就犹如不与取时，诸王捉了盗贼后，"}, "89": {"pali": "haneyyuṃ vā bandheyyuṃ vā pabbājeyyuṃ vā", "zh": "可能处决、捆缚或流放："}, "90": {"pali": "corosi bālosi mūḷhosi thenosīti", "zh": "“你是小偷，你是愚者，你是痴者，你是盗贼。”"}, "91": {"pali": "tathārūpaṃ bhikkhu adinnaṃ ādiyamāno", "zh": "同样地，比库不与而取，"}, "92": {"pali": "ayampi pārājiko hoti asaṃvāso", "zh": "这也是巴拉基咖，不共住。"}, "93": {"pali": "Yo pana bhikkhu sañcicca", "zh": "若比库故意"}, "94": {"pali": "manussa-viggahaṃ jīvitā voropeyya", "zh": "夺取人命，"}, "95": {"pali": "sattha-hārakaṃ vāssa pariyeseyya", "zh": "或为其寻找并持来杀具，"}, "96": {"pali": "maraṇa-vaṇṇaṃ vā saṃvaṇṇeyya", "zh": "或赞叹死的美好，"}, "97": {"pali": "maraṇāya vā samādapeyya", "zh": "或劝勉死:"}, "98": {"pali": "ambho purisa kiṃ", "zh": "“喂，男子！为什么"}, "99": {"pali": "tuyhiminā pāpakena dujjīvitena", "zh": "你如此恶苦地活着？"}, "100": {"pali": "mataṃ te jīvitā seyyo ti", "zh": "死比活着更好。”"}, "101": {"pali": "iti cittamano cittasaṅkappo", "zh": "如此之心意、种种思惟，"}, "102": {"pali": "aneka-pariyāyena maraṇa-vaṇṇaṃ vā saṃvaṇṇeyya", "zh": "以各种方法赞叹死的美好，"}, "103": {"pali": "maraṇāya vā samādapeyya", "zh": "或劝勉死，"}, "104": {"pali": "ayampi pārājiko hoti asaṃvāso", "zh": "这也是巴拉基咖，不共住。"}, "105": {"pali": "Yo pana bhikkhu anabhijānaṃ", "zh": "若比库声称未证知的"}, "106": {"pali": "uttari-manussa-dhammaṃ attupanāyikaṃ", "zh": "关于自己的上人法、"}, "107": {"pali": "alamariya-ñāṇadassanaṃ samudācareyya", "zh": "能为圣者的智见:"}, "108": {"pali": "iti jānāmi iti passāmī ti", "zh": "“我知如此，我见如此。”"}, "109": {"pali": "tato aparena samayena", "zh": "从那之后时，"}, "110": {"pali": "samanu|ggāhīyamāno vā asamanu|ggāhīyamāno vā", "zh": "被检问或没有被检问，"}, "111": {"pali": "āpanno visuddhāpekkho evaṃ vadeyya", "zh": "若希望所犯的清净而如此说："}, "112": {"pali": "ajānamevaṃ āvuso avacaṃ jānāmi", "zh": "“贤友，不知如此而说‘我知’，"}, "113": {"pali": "apassaṃ passāmi", "zh": "不见[而说] ‘我见’，"}, "114": {"pali": "tucchaṃ musā vilapin ti", "zh": "[我说了]空无、虚伪、妄语。”"}, "115": {"pali": "aññatra adhimānā ayampi pārājiko hoti asaṃvāso", "zh": "除了增上慢外，这也是巴拉基咖，不共住。"}, "116": {"pali": "Uddiṭṭhā kho āyasmanto cattāro pārājikā dhammā", "zh": "具寿们，已经诵出四巴拉基咖法。"}, "117": {"pali": "Yesaṃ bhikkhu aññataraṃ vā aññataraṃ vā āpajjitvā", "zh": "若比库犯了其中任何之一，"}, "118": {"pali": "na labhati bhikkhūhi saddhiṃ saṃvāsaṃ", "zh": "则不得与比库们一起共住，"}, "119": {"pali": "yathā pure tathā pacchā", "zh": "以后就像先前那样，"}, "120": {"pali": "pārājiko hoti asaṃvāso", "zh": "是巴拉基咖，不共住。"}, "121": {"pali": "Tatthāyasmante pucchāmi kaccittha parisuddhā", "zh": "在此我问诸具寿:“于此是否清净？”"}, "122": {"pali": "dutiyampi pucchāmi kaccittha parisuddhā", "zh": "第二次我再问:“于此是否清净？”"}, "123": {"pali": "tatiyampi pucchāmi kaccittha parisuddhā", "zh": "第三次我再问:“于此是否清净？”"}, "124": {"pali": "parisuddhetthāyasmanto", "zh": "于此诸具寿是清净的，"}, "125": {"pali": "tasmā tuṇhī evametaṃ dhārayāmīti", "zh": "因此默然。此事我如是持。"}, "126": {"pali": "pārājikuddeso dutiyo", "zh": "巴拉基咖诵第二"}, "127": {"pali": "Sutā kho panāyasmantehi", "zh": "以下已被具寿们所听闻"}, "128": {"pali": "terasa saṅghādisesā dhammā", "zh": "十三僧始终"}, "129": {"pali": "dve aniyatā dhammā", "zh": "二不定法"}, "130": {"pali": "tiṃsa nissaggiyā pācittiyā dhammā", "zh": "三十舍堕法"}, "131": {"pali": "dvenavuti pācittiyā dhammā", "zh": "九十二巴吉帝亚"}, "132": {"pali": "cattāro pāṭidesanīyā dhammā", "zh": "四应悔过"}, "133": {"pali": "sekhiyā dhammā", "zh": "应学法"}, "134": {"pali": "satta adhikaraṇasamathā dhammā", "zh": "七止诤法"}, "135": {"pali": "avivadamānehi sikkhitabbaṃ", "zh": "应被无争议者学修。"}, "136": {"pali": "Ime kho panāyasmanto", "zh": "具寿们，把这"}, "137": {"pali": "terasa saṅghādisesā dhammā uddesaṃ āgacchanti", "zh": "十三僧始终法来诵出。"}, "138": {"pali": "Sañcetanikā sukka-vissaṭṭhi", "zh": "故意出精，"}, "139": {"pali": "aññatra supinantā saṅghādiseso", "zh": "除了梦中外，僧始终。"}, "140": {"pali": "Yo pana bhikkhu otiṇṇo", "zh": "若比库陷入欲望"}, "141": {"pali": "vipariṇatena cittena", "zh": "以变易之心"}, "142": {"pali": "mātu-gāmena saddhiṃ", "zh": "与女人"}, "143": {"pali": "kāya-saṃsaggaṃ samāpajjeyya", "zh": "发生身体相接触，"}, "144": {"pali": "hattha-ggāhaṃ vā veṇi-ggāhaṃ vā", "zh": "或牵手，或捉发，"}, "145": {"pali": "aññatarassa vā aññatarassa vā", "zh": "或对任何"}, "146": {"pali": "aṅgassa parāmasanaṃ saṅghādiseso", "zh": "肢体部分进行摩触者，僧始终。"}, "147": {"pali": "Yo pana bhikkhu otiṇṇo", "zh": "若比库以贪爱、"}, "148": {"pali": "vipariṇatena cittena mātu-gāmaṃ", "zh": "变易之心对女人"}, "149": {"pali": "duṭṭhullāhi vācāhi obhāseyya", "zh": "说粗恶语，"}, "150": {"pali": "yathā taṃ yuvā yuvatiṃ", "zh": "犹如少男对少女[说]"}, "151": {"pali": "methun'upasaṃhitāhi saṅghādiseso", "zh": "与淫欲相关者一样，僧始终。"}, "152": {"pali": "Yo pana bhikkhu otiṇṇo", "zh": "若比库以贪爱、"}, "153": {"pali": "vipariṇatena cittena mātu-gāmassa santike", "zh": "变易之心于女人面前，"}, "154": {"pali": "atta-kāma-pāricariyāya vaṇṇaṃ bhāseyya", "zh": "说以[淫]欲侍奉自己的好处:"}, "155": {"pali": "etadaggaṃ bhagini pāricariyānaṃ", "zh": "“姐妹，此乃诸侍奉中的最上："}, "156": {"pali": "yā mādisaṃ sīlavantaṃ kalyāṇa-dhammaṃ brahma-cāriṃ", "zh": "像我这样的持戒者、善法者、梵行者，"}, "157": {"pali": "etena dhammena paricareyyā ti", "zh": "应该以此法来侍奉。”"}, "158": {"pali": "methun'upasaṃhitena saṅghādiseso", "zh": "与淫欲相关者，僧始终。"}, "159": {"pali": "Yo pana bhikkhu sañcarittaṃ samāpajjeyya", "zh": "若比库从事作媒，"}, "160": {"pali": "itthiyā vā purisa-matiṃ", "zh": "[传达]男子之意给女子，"}, "161": {"pali": "purisassa vā itthi-matiṃ", "zh": "或女子之意给男子，"}, "162": {"pali": "jāyattane vā jārattane vā", "zh": "而成为夫妻或情人，"}, "163": {"pali": "antamaso taṅkhaṇikāyapi saṅghādiseso", "zh": "乃至短暂关系，也僧始终。"}, "164": {"pali": "Saññācikāya pana bhikkhunā kuṭiṃ kārayamānena", "zh": "当比库自行乞求建造孤邸"}, "165": {"pali": "assāmikaṃ attuddesaṃ pamāṇikā kāretabbā", "zh": "无[施]主的为自己的时，当应量而造。"}, "166": {"pali": "tatridaṃ pamāṇaṃ", "zh": "这里的量是："}, "167": {"pali": "dīghaso dvādasa vidatthiyo sugata-vidatthiyā", "zh": "长为善至张手的十二张手，"}, "168": {"pali": "tiriyaṃ satt'antarā", "zh": "内部宽为七张。"}, "169": {"pali": "bhikkhū abhinetabbā vatthu-desanāya", "zh": "应带领比库们指示地点，"}, "170": {"pali": "tehi bhikkhūhi vatthu desetabbaṃ", "zh": "应由那些比库指示"}, "171": {"pali": "anārambhaṃ saparikkamanaṃ", "zh": "无侵害、有环绕空间的地点。"}, "172": {"pali": "Sārambhe ce bhikkhu vatthusmiṃ aparikkamane", "zh": "若比库在有侵害、无环绕空间的地点"}, "173": {"pali": "saññācikāya kuṭiṃ kāreyya", "zh": "自行乞求而建造孤邸，"}, "174": {"pali": "bhikkhū vā anabhineyya vatthu-desanāya", "zh": "或未带领比库们指示地点，"}, "175": {"pali": "pamāṇaṃ vā atikkāmeyya saṅghādiseso", "zh": "或超过量者，僧始终。"}, "176": {"pali": "Mahallakaṃ pana bhikkhunā vihāraṃ kārayamānena", "zh": "当比库建造大住所时，"}, "177": {"pali": "sassāmikaṃ attuddesaṃ", "zh": "有[施]主且为自己的"}, "178": {"pali": "bhikkhū abhinetabbā vatthu-desanāya", "zh": "应带领比库们指示地点，"}, "179": {"pali": "tehi bhikkhūhi vatthu desetabbaṃ", "zh": "应由那些比库指示"}, "180": {"pali": "anārambhaṃ saparikkamanaṃ", "zh": "无侵害、有环绕空间的地点。"}, "181": {"pali": "Sārambhe ce bhikkhu vatthusmiṃ aparikkamane", "zh": "若比库在有侵害、无环绕空间的地点"}, "182": {"pali": "mahallakaṃ vihāraṃ kāreyya", "zh": "自行乞求而建造大住所，"}, "183": {"pali": "bhikkhū vā anabhineyya vatthu-desanāya saṅghādiseso", "zh": "或未带领比库们指示地点者，僧始终。"}, "184": {"pali": "Yo pana bhikkhu bhikkhuṃ duṭṭho doso appatīto", "zh": "若比库恶意、瞋恨、不满，"}, "185": {"pali": "amūlakena pārājikena dhammena anuddhaṃseyya", "zh": "以无根据的巴拉基咖法诽谤比库:"}, "186": {"pali": "appeva nāma naṃ imamhā brahma-cariyā cāveyyan ti", "zh": "“或许因此能使他从梵行中退堕。”"}, "187": {"pali": "tato aparena samayena", "zh": "在此后的其他时间，"}, "188": {"pali": "samanuggāhīyamāno vā asamanuggāhīyamāno vā", "zh": "[无论]被检问或没有被检问，"}, "189": {"pali": "amūlakañceva taṃ adhikaraṇaṃ hoti", "zh": "那只是毫无根据的事件，"}, "190": {"pali": "bhikkhu ca dosaṃ patiṭṭhāti saṅghādiseso", "zh": "而且比库乃基于瞋恨，僧始终。"}, "191": {"pali": "Yo pana bhikkhu bhikkhuṃ duṭṭho doso appatīto", "zh": "若比库恶意、瞋恨、不满，"}, "192": {"pali": "añña-bhāgiyassa adhikaraṇassa", "zh": "他事件的"}, "193": {"pali": "kiñcidesaṃ lesa-mattaṃ upādāya", "zh": "部分类似之处取之，"}, "194": {"pali": "pārājikena dhammena anuddhaṃseyya", "zh": "以巴拉基咖法诽谤比库："}, "195": {"pali": "appeva nāma naṃ imamhā brahma-cariyā cāveyyan ti", "zh": "“或许因此能使他从梵行中退堕。”"}, "196": {"pali": "tato aparena samayena", "zh": "在此后的其他时间，"}, "197": {"pali": "samanuggāhīyamāno vā asamanuggāhīyamāno vā", "zh": "[无论]被检问或没有被检问，"}, "198": {"pali": "añña-bhāgiyañceva taṃ adhikaraṇaṃ hoti", "zh": "那只是就其他事件的"}, "199": {"pali": "kocideso lesa-matto upādinno", "zh": "部分类似之处取之，"}, "200": {"pali": "bhikkhu ca dosaṃ patiṭṭhāti saṅghādiseso", "zh": "而且比库乃基于瞋恨，僧始终。"}, "201": {"pali": "Yo pana bhikkhu samaggassa saṅghassa", "zh": "若比库对和合的僧团"}, "202": {"pali": "bhedāya parakkameyya", "zh": "致力于分裂，"}, "203": {"pali": "bhedana-saṃvattanikaṃ vā adhikaraṇaṃ", "zh": "或对导致分裂之事"}, "204": {"pali": "samādāya paggayha tiṭṭheyya", "zh": "受持、坚持、住立。"}, "205": {"pali": "so bhikkhu bhikkhūhi evam·assa vacanīyo", "zh": "比库们应如此劝告那个比库："}, "206": {"pali": "māyasmā samaggassa saṅghassa", "zh": "“请具寿不要对和合的僧团"}, "207": {"pali": "bhedāya parakkami", "zh": "致力于分裂，"}, "208": {"pali": "bhedana-saṃvattanikaṃ vā adhikaraṇaṃ", "zh": "或对导致分裂之事"}, "209": {"pali": "samādāya paggayha aṭṭhāsi", "zh": "受持、坚持、住立。"}, "210": {"pali": "sametāyasmā saṅghena samaggo hi saṅgho", "zh": "具寿，请与僧团和合，和合的僧团确实是"}, "211": {"pali": "sammodamāno avivadamāno", "zh": "欢喜、无诤、"}, "212": {"pali": "ekuddeso phāsu viharatī ti", "zh": "同一诵[戒]、安乐而住的！”"}, "213": {"pali": "evañca so bhikkhu bhikkhūhi", "zh": "当那个比库被比库们"}, "214": {"pali": "vuccamāno tatheva paggaṇheyya", "zh": "如此劝告时，若他仍然坚持，"}, "215": {"pali": "so bhikkhu bhikkhūhi", "zh": "那个比库应被比库们"}, "216": {"pali": "yāva-tatiyaṃ samanubhāsitabbo", "zh": "劝谏直到第三次，"}, "217": {"pali": "tassa paṭinissaggāya", "zh": "使他舍弃。"}, "218": {"pali": "yāva-tatiyañce samanubhāsiyamāno", "zh": "假如在劝谏直到第三次时"}, "219": {"pali": "taṃ paṭin gāmaṃ vā nigamaṃ vā upanissāya", "zh": "村或镇依止"}, "279": {"pali": "viharati kula-dūsako pāpa-samācāro", "zh": "而住，[却]是污家者，恶行者。"}, "280": {"pali": "tassa kho pāpakā samācārā", "zh": "他的恶行"}, "281": {"pali": "dissanti ceva suyyanti ca", "zh": "被看见且被听闻，"}, "282": {"pali": "kulāni ca tena duṭṭhāni", "zh": "以及被他所污的诸家"}, "283": {"pali": "dissanti ceva suyyanti ca", "zh": "被看见且被听闻。"}, "284": {"pali": "so bhikkhu bhikkhūhi evam·assa vacanīyo", "zh": "比库们应如此劝告那个比库:"}, "285": {"pali": "āyasmā kho kula-dūsako pāpa-samācāro", "zh": "“具寿实是污家者，恶行者。"}, "286": {"pali": "āyasmato kho pāpakā samācārā", "zh": "具寿的恶行"}, "287": {"pali": "dissanti ceva suyyanti ca", "zh": "被看见且被听闻，"}, "288": {"pali": "kulāni cāyasmatā duṭṭhāni", "zh": "以及被具寿所污的诸家"}, "289": {"pali": "dissanti ceva suyyanti ca", "zh": "被看见且被听闻。"}, "290": {"pali": "pakkamatāyasmā imamhā āvāsā", "zh": "请具寿离开此住处，"}, "291": {"pali": "alaṃ te idha vāsenā ti", "zh": "你在这里已住够了！”"}, "292": {"pali": "evañca so bhikkhu bhikkhūhi vuccamāno", "zh": "当比库们如此劝告那个比库时，"}, "293": {"pali": "te bhikkhū evaṃ vadeyya", "zh": "却如此对那些比库说:"}, "294": {"pali": "chanda-gāmino ca bhikkhū", "zh": "“比库们是随欲者，"}, "295": {"pali": "dosa-gāmino ca bhikkhū", "zh": "比库们是随瞋者，"}, "296": {"pali": "moha-gāmino ca bhikkhū", "zh": "比库们是随痴者，"}, "297": {"pali": "bhaya-gāmino ca bhikkhū", "zh": "比库们是随怖者。"}, "298": {"pali": "tādisikāya āpattiyā ekaccaṃ pabbājenti", "zh": "对同样的罪，驱出一些人，"}, "299": {"pali": "ekaccaṃ na pabbājentī ti", "zh": "不驱出一些人。”"}, "300": {"pali": "so bhikkhu bhikkhūhi evam·assa vacanīyo", "zh": "比库们应如此劝告那个比库:"}, "301": {"pali": "māyasmā evaṃ avaca", "zh": "“请具寿不要如此说。"}, "302": {"pali": "na ca bhikkhū chanda-gāmino", "zh": "比库们不是随欲者，"}, "303": {"pali": "na ca bhikkhū dosa-gāmino", "zh": "比库们不是随瞋者，"}, "304": {"pali": "na ca bhikkhū moha-gāmino", "zh": "比库们不是随痴者，"}, "305": {"pali": "na ca bhikkhū bhaya-gāmino", "zh": "比库们不是随怖者。"}, "306": {"pali": "āyasmā kho kula-dūsako pāpa-samācāro", "zh": "具寿实是污家者，恶行者。"}, "307": {"pali": "āyasmato kho pāpakā samācārā",   cur=new Audio(b.dataset.src); cur.play().catch(()=>{});
});
const root=document.getElementById('root');
const chapters=[[1,"事前任务 Pubbakaraṇa",0,35],[2,"序诵 Nidānuddesa",36,79],[3,"巴拉基咖 Pārājika",80,135],[4,"僧始终 Saṅghādisesa",136,352]];
for(const [ch,title,a,bb] of chapters){
  const h=document.createElement('h2'); h.textContent='第'+ch+'章 '+title+' ('+a+'-'+bb+')'; root.appendChild(h);
  for(let i=a;i<=bb;i++){
    const d=DATA[i]; if(!d) continue;
    const row=document.createElement('div'); row.className='row';
    row.innerHTML='<span class="idx">'+i+'</span><span class="pali">'+d.pali+'</span>'+
      '<button class="play" data-src="audio/sent_new/'+i+'.mp3">▶</button>';
    root.appendChild(row);
  }
}
</script>
