<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>巴帝摩卡 · 分句音频链式重切标注</title>
<style>
  :root{ --bg:#fafafa; --card:#fff; --line:#e3e3e3; --ink:#222; --muted:#888;
         --green:#2e9e4f; --red:#e0483b; --blue:#2f7fd6; --amber:#e6a23c; }
  *{box-sizing:border-box}
  body{margin:0;font:15px/1.5 system-ui,"Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink)}
  header{padding:12px 18px;border-bottom:1px solid var(--line);background:var(--card);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0}
  .hint{color:var(--muted);font-size:13px}
  .wrap{display:flex;gap:14px;padding:14px;max-width:1180px;margin:0 auto}
  .side{width:336px;flex:0 0 336px;border:1px solid var(--line);border-radius:10px;background:var(--card);overflow:auto;max-height:82vh}
  .side h2{font-size:13px;margin:0;padding:10px 12px;background:#f3f3f3;border-bottom:1px solid var(--line)}
  .sent{padding:8px 12px;border-bottom:1px solid #f0f0f0;cursor:pointer;display:flex;flex-direction:column;gap:2px}
  .sent .line1{display:flex;gap:8px;align-items:baseline}
  .sent .rom{font-style:italic;color:#333;word-break:break-word;line-height:1.3}
  .sent .zh{font-size:12px;color:var(--muted);word-break:break-word;line-height:1.3}
  .sent:hover{background:#f6f9ff}
  .sent.active{background:#e8f1ff;border-left:3px solid var(--blue)}
  .sent .idx{font-weight:600;color:var(--blue)}
  .sent .ed{font-size:11px}
  .sent .ed.ok{color:var(--green)}
  .sent .ed.unsaved{color:var(--amber)}
  .main{flex:1;min-width:0}
  .card{border:1px solid var(--line);border-radius:10px;background:var(--card);padding:16px;margin-bottom:14px}
  .idxbig{font-size:22px;font-weight:700;color:var(--blue)}
  .roman{font-size:18px;margin:8px 0 4px;font-style:italic;color:#333;word-break:break-word}
  .zhbig{font-size:14px;color:var(--muted);margin:0 0 8px;word-break:break-word}
  .meta{color:var(--muted);font-size:13px;margin-bottom:10px}
  .times{display:flex;gap:18px;margin:6px 0 10px;font-variant-numeric:tabular-nums;flex-wrap:wrap}
  .times b{color:var(--ink)}
  .track{position:relative;height:64px;background:#f0f2f5;border-radius:8px;margin:10px 0;overflow:hidden;border:1px solid var(--line);touch-action:none}
  .bandA{position:absolute;top:0;bottom:0;background:rgba(46,158,79,.18);border-left:2px solid var(--green);border-right:1px dashed var(--green);pointer-events:none}
  .bandB{position:absolute;top:0;bottom:0;background:rgba(230,162,60,.16);border-right:1px dashed var(--amber);pointer-events:none}
  .startMark{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--green);border-radius:3px;cursor:ew-resize;z-index:3}
  .endMark{position:absolute;top:0;bottom:0;width:6px;margin-left:-3px;background:var(--red);border-radius:3px;cursor:ew-resize;z-index:3}
  .startMark::after,.endMark::after{content:"";position:absolute;inset:0 -8px;z-index:4}
  .playhead{position:absolute;top:0;bottom:0;width:3px;background:#111;z-index:5;cursor:ew-resize}
  .playhead::before{content:"";position:absolute;top:0;left:-7px;width:17px;height:15px;background:#111;border-radius:0 0 7px 7px;box-shadow:0 1px 2px rgba(0,0,0,.35);z-index:6}
  .playhead::after{content:"";position:absolute;top:0;bottom:0;left:-11px;right:-11px;z-index:6}
  .scale{display:flex;justify-content:space-between;color:var(--muted);font-size:12px;margin-top:-4px}
  .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:8px}
  button{font:inherit;padding:8px 13px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
  button:hover{background:#f3f6fb}
  button.primary{background:var(--blue);color:#fff;border-color:var(--blue)}
  button.primary:hover{filter:brightness(1.05)}
  button.play{background:var(--green);color:#fff;border-color:var(--green);font-size:16px;padding:10px 18px}
  button.submit{background:var(--green);color:#fff;border-color:var(--green)}
  button.submit:hover{filter:brightness(1.05)}
  .fine{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .fine button{padding:6px 10px;font-size:13px}
  .status{margin-top:10px;color:var(--muted);font-size:13px;min-height:18px}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px;flex-wrap:wrap}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
  /* 章节选择页 */
  #picker{padding:24px;max-width:900px;margin:0 auto}
  #picker h2{font-size:18px}
  .chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
  .chcard{border:1px solid var(--line);border-radius:12px;background:#fff;padding:14px 16px;cursor:pointer;text-align:left}
  .chcard:hover{background:#f3f9ff;border-color:var(--blue)}
  .chcard .t{font-weight:600;font-size:15px}
  .chcard .c{color:var(--muted);font-size:13px;margin-top:4px}
  .chcard.disabled{opacity:.5;cursor:not-allowed}
  .chcard.disabled:hover{background:#fff;border-color:var(--line)}
  .back{margin-right:auto}
</style>
</head>
<body>
<header>
  <h1 id="title">巴帝摩卡 · 分句音频标注</h1>
  <span class="hint" id="hint">分句音频 · <b>绿色起点</b>与<b>红色终点</b>把手都可拖动 · 下一句起点自动接上一句终点 · 点<b>提交本句</b>即存盘 · <b>空格</b>=播放/暂停</span>
</header>

<!-- 章节选择页 -->
<div id="picker" style="display:none">
  <h2>选择要标注的章节</h2>
  <p class="hint">每章用真人诵戒录音拼成一条连续音轨，可拖动起/终点把手逐句精标边界。标完后可一键烘焙成独立音频接入背诵 app。</p>
  <div class="chgrid" id="chgrid"></div>
</div>

<!-- 标注工具页 -->
<div class="wrap" id="app" style="display:none">
  <div class="side">
    <h2 id="listTitle">句子</h2>
    <div id="list"></div>
  </div>
  <div class="main">
    <div class="card">
      <span class="idxbig" id="idx">—</span>
      <div class="roman" id="roman"></div>
      <div class="zhbig" id="zh"></div>
      <div class="meta" id="meta"></div>

      <div class="times">
        <div>起点 <b id="tStart">0.00</b> s <span style="color:var(--green)">（可拖）</span></div>
        <div>终点 <b id="tEnd">0.00</b> s <span style="color:var(--red)">（可拖）</span></div>
        <div>原句长 <b id="tDur">0.00</b> s</div>
        <div>当前 <b id="tCur">0.00</b> s <span style="color:#111">（播放线·可拖）</span></div>
      </div>

      <div class="track" id="track">
        <div class="bandA" id="bandA"></div>
        <div class="bandB" id="bandB"></div>
        <div class="startMark" id="startMark" title="拖动调整起点"></div>
        <div class="endMark" id="endMark" title="拖动调整终点"></div>
        <div class="playhead" id="playhead"></div>
      </div>
      <div class="scale"><span id="scL">0.0s</span><span id="scR">0.0s</span></div>

      <div class="legend">
        <span><i style="background:rgba(46,158,79,.4)"></i>本句音频</span>
        <span><i style="background:rgba(230,162,60,.4)"></i>后5秒（下一句开头，供判断）</span>
        <span><i style="background:var(--red)"></i>你拖的终点</span>
        <span><i style="background:#111;width:3px"></i>播放线（可拖定位）</span>
      </div>

      <div class="row">
        <button class="play" id="playBtn">▶ 播放本句</button>
        <button id="playTail">▶ 含后5秒试听</button>
        <button id="prev">◀ 上一句</button>
        <button id="next">下一句 ▶</button>
        <button id="resetOne">重置本句</button>
      </div>

      <div class="fine">
        <span>微调终点：</span>
        <button data-d="-10">−10s</button>
        <button data-d="-1">−1s</button>
        <button data-d="-0.1">−0.1s</button>
        <button data-d="0.1">+0.1s</button>
        <button data-d="1">+1s</button>
        <button data-d="10">+10s</button>
      </div>

      <div class="row">
        <button class="submit" id="submitOne">✓ 提交本句</button>
        <button id="submitNext">✓ 提交并下一句 ▶</button>
      </div>
      <div class="row">
        <button class="primary" id="save">保存全部边界</button>
        <button id="backCh">← 返回章节选择</button>
      </div>
      <div class="status" id="status"></div>
    </div>
  </div>
</div>

<audio id="audio" preload="metadata"></audio>

<script>
// 若不是从本地标注服务器(8731)打开（如 WorkBuddy 预览面板），改用绝对地址取数据与音频
const BASE = (location.hostname + ":" + location.port) === "127.0.0.1:8731" ? "" : "http://127.0.0.1:8731";
const audio = document.getElementById('audio');

// 取章节参数
const CH = new URL(location.href).searchParams.get('ch');

function esc(s){ return (s==null?'':String(s)).replace(/[&<>]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])); }
function setStatus(t, type){
  const el=document.getElementById('status');
  if(!el) return;
  el.textContent=t;
  el.style.color = type==='ok' ? 'var(--green)' : type==='err' ? 'var(--red)' : 'var(--muted)';
}

// ===== 章节选择页 =====
async function showPicker(){
  document.getElementById('title').textContent='巴帝摩卡 · 选择章节';
  document.getElementById('picker').style.display='block';
  document.getElementById('app').style.display='none';
  try{
    const chs = await (await fetch(BASE + '/chapters')).json();
    const grid = document.getElementById('chgrid'); grid.innerHTML='';
    chs.forEach(c=>{
      const div=document.createElement('div');
      const has = c.hasAudio && c.sentences>0;
      div.className='chcard'+(has?'':' disabled');
      div.innerHTML='<div class="t">'+esc(c.title)+'</div><div class="c">'+(has?('可标注 · '+c.sentences+' 句（idx '+c.start+'–'+c.end+'）'):'无真人录音，暂不可调')+'</div>';
      if(has) div.onclick=()=>{ location.href = (location.pathname||'/annotate3.html') + '?ch=' + c.ch; };
      grid.appendChild(div);
    });
  }catch(e){ setStatus('⚠️ 读取章节失败：'+e.message,'err'); }
}

// ===== 标注工具（按章）=====
let SENT = {};        // idx -> {clip,roman,zh}
let MAP = {};         // idx -> {offset,dur}
let ORDER = [];       // sorted idx list of this chapter
let userStart = {};   // idx -> 起点覆盖值（可拖）
let userEnd = {};     // idx -> 终点覆盖值（可拖）
let edited = new Set();
let submitted = new Set();
let bounds = {};
let cur = 0;
let stopAt = null;
let winStart = 0, winEnd = 10;
let scrubTime = null;
let isScrubbing = false;
let CH_TITLE = '';

async function boot(){
 try{
  // 1) 章节元数据（标题）
  const chs = await (await fetch(BASE + '/chapters')).json();
  const meta = chs.find(c=>String(c.ch)===String(CH));
  CH_TITLE = meta ? meta.title : ('第'+CH+'章');

  // 2) 本章映射表：每句在连续音轨里的 offset / dur
  const mapArr = await (await fetch(BASE + '/audio/ch'+CH+'_map.json')).json();
  if(!mapArr || !mapArr.length){ setStatus('⚠️ 第'+CH+'章没有连续音轨（ch'+CH+'_full.m4a），无法标注。请先运行 rebuild_tracks.js。','err'); return; }
  MAP={}; ORDER=[];
  mapArr.forEach(m=>{ MAP[m.idx]={offset:m.offset,dur:m.dur}; ORDER.push(m.idx); });

  // 3) manifest：取巴利/中文文本
  const txt = await (await fetch(BASE + '/audio/manifest_audio.js')).text();
  const root = JSON.parse(txt.replace(/^[\s\S]*?window\.PM_AUDIO\s*=\s*/,'').replace(/;\s*$/,''));
  const m = root.sentences;
  for(const i of ORDER){
    const e=m[String(i)];
    if(!e) continue;
    const roman=(e.words||[]).map(w=>w.p).join(' ');
    const zh=(e.words||[]).map(w=>w.z).join(' ');
    SENT[i]={clip:e.clip, roman, zh};
  }

  // 4) 续标：读取已存边界
  try{
    const b = await (await fetch(BASE + '/bounds?ch='+CH)).json();
    for(const k in b){ const idx=+k; if(SENT[idx]){ userStart[idx]=b[k][0]; userEnd[idx]=b[k][1]; submitted.add(idx); } }
  }catch(e){}

  audio.src = BASE + '/audio/ch'+CH+'_full.m4a';
  document.getElementById('title').textContent = '第'+CH+'章 链式重切 · ' + CH_TITLE;
  document.getElementById('listTitle').textContent = CH_TITLE + '（idx '+ORDER[0]+'–'+ORDER[ORDER.length-1]+'）';
  document.getElementById('picker').style.display='none';
  document.getElementById('app').style.display='flex';
  cur = ORDER[0];
  recompute();
  buildList();
  load(cur);
  setStatus('已加载第'+CH+'章 '+ORDER.length+' 句。起点(绿)/终点(红)把手都可拖动；改完点「提交本句」即存盘。', 'ok');
 }catch(e){
  setStatus('⚠️ 加载失败：'+e.message+'（若用预览面板打开，请改用 http://localhost:8731/annotate3.html?ch='+CH+'）','err');
 }
}

function durOf(i){ return MAP[i] ? (MAP[i].dur||1) : 1; }
function baseStartOf(i){ return MAP[i] ? (MAP[i].offset||0) : 0; }

function recompute(){
  bounds={};
  let prevEnd=0;
  for(const i of ORDER){
    const d = durOf(i);
    const s = (userStart[i]!==undefined) ? userStart[i] : (i===ORDER[0] ? baseStartOf(i) : prevEnd);
    const e = (userEnd[i]!==undefined) ? userEnd[i] : s + d;
    bounds[i]=[s,e];
    prevEnd = e;
  }
}

function buildList(){
  const el=document.getElementById('list'); el.innerHTML='';
  for(const i of ORDER){
    const d=document.createElement('div');
    d.className='sent'+(i===cur?' active':'');
    d.dataset.idx=i;
    let tag='';
    if(submitted.has(i)) tag='<span class="ed ok">✓已提交</span>';
    else if(edited.has(i)) tag='<span class="ed unsaved">✎未提交</span>';
    d.innerHTML='<div class="line1"><span class="idx">'+i+'</span> <span class="rom">'+esc(SENT[i].roman)+'</span></div>'
      +'<div class="zh">'+esc(SENT[i].zh)+'</div>'+tag;
    d.onclick=()=>load(i);
    el.appendChild(d);
  }
}
function refreshActive(){
  document.querySelectorAll('.sent').forEach(s=>{
    const i=+s.dataset.idx;
    s.classList.toggle('active', i===cur);
    const old=s.querySelector('.ed');
    if(old) old.remove();
    if(submitted.has(i)){ const sp=document.createElement('span'); sp.className='ed ok'; sp.textContent='✓已提交'; s.appendChild(sp); }
    else if(edited.has(i)){ const sp=document.createElement('span'); sp.className='ed unsaved'; sp.textContent='✎未提交'; s.appendChild(sp); }
  });
}

function load(i){
  cur=i;
  const [s,e]=bounds[i];
  const d=durOf(i);
  winStart=0;
  winEnd=Math.max(e, s+d+5)+2;
  document.getElementById('idx').textContent=i;
  document.getElementById('roman').textContent=SENT[i]?SENT[i].roman:'(无文本)';
  document.getElementById('zh').textContent=SENT[i]?SENT[i].zh:'';
  document.getElementById('meta').textContent='clip: '+(SENT[i]?SENT[i].clip:'-');
  document.getElementById('tStart').textContent=s.toFixed(2);
  document.getElementById('tEnd').textContent=e.toFixed(2);
  document.getElementById('tDur').textContent=d.toFixed(2);
  renderMarks();
  refreshActive();
  audio.pause();
  audio.currentTime=s;
  scrubTime=null;
  updatePlayhead();
}

function renderMarks(){
  const [s,e]=bounds[cur];
  const d=durOf(cur);
  const len=winEnd-winStart;
  const pa=x=>((x-winStart)/len*100)+'%';
  document.getElementById('bandA').style.left=pa(s);
  document.getElementById('bandA').style.width=((d)/len*100)+'%';
  document.getElementById('bandB').style.left=pa(s+d);
  document.getElementById('bandB').style.width=((5)/len*100)+'%';
  document.getElementById('startMark').style.left=pa(s);
  document.getElementById('endMark').style.left=pa(e);
  document.getElementById('scL').textContent=winStart.toFixed(1)+'s';
  document.getElementById('scR').textContent=winEnd.toFixed(1)+'s';
}

const trackEl = document.getElementById('track');
function clientXToTime(clientX){
  const rect = trackEl.getBoundingClientRect();
  let x = (clientX-rect.left)/rect.width;
  x = Math.max(0,Math.min(1,x));
  return winStart + x*(winEnd-winStart);
}
function beginScrub(){
  isScrubbing=true; audio.pause(); stopAt=null;
  function move(e2){
    const t = clientXToTime(e2.clientX);
    scrubTime = t;
    if(isFinite(audio.duration) && audio.duration>0) audio.currentTime = t;
    updatePlayhead();
  }
  function up(){
    isScrubbing=false;
    trackEl.removeEventListener('pointermove',move);
    trackEl.removeEventListener('pointerup',up);
  }
  trackEl.addEventListener('pointermove',move);
  trackEl.addEventListener('pointerup',up);
}
function beginDrag(which){
  function move(e2){
    let t=clientXToTime(e2.clientX);
    if(which==='start'){
      t=Math.min(t, bounds[cur][1]-0.05);
      userStart[cur]=Math.max(0,t);
    } else {
      t=Math.max(t, bounds[cur][0]+0.05);
      userEnd[cur]=t;
    }
    recompute();
    if(which==='end' && bounds[cur][1]>winEnd){ winEnd=bounds[cur][1]+2; }
    renderMarks();
    document.getElementById('tStart').textContent=bounds[cur][0].toFixed(2);
    document.getElementById('tEnd').textContent=bounds[cur][1].toFixed(2);
    edited.add(cur);
    refreshActive();
  }
  function up(){
    trackEl.removeEventListener('pointermove',move);
    trackEl.removeEventListener('pointerup',up);
  }
  trackEl.addEventListener('pointermove',move);
  trackEl.addEventListener('pointerup',up);
}

function togglePlay(){
  if(audio.paused){
    const [s,e]=bounds[cur];
    let start;
    if(scrubTime!==null){
      start = Math.min(Math.max(scrubTime, s), e-0.05);
    } else if(audio.currentTime < s || audio.currentTime >= e){
      start = s;
    } else {
      start = audio.currentTime;
    }
    if(isFinite(audio.duration) && audio.duration>0) audio.currentTime = start;
    stopAt=e;
    scrubTime=null;
    audio.play();
  } else audio.pause();
}
document.getElementById('playBtn').onclick=togglePlay;
document.getElementById('playTail').onclick=()=>{
  const [s]=bounds[cur];
  const d=durOf(cur);
  audio.currentTime=Math.max(s, s+d-2); stopAt=s+d+4; audio.play();
};
audio.addEventListener('timeupdate',()=>{
  if(!isScrubbing) scrubTime=null;
  updatePlayhead();
  if(stopAt!==null && audio.currentTime>=stopAt){ audio.pause(); audio.currentTime=bounds[cur][0]; stopAt=null; }
});
function updatePlayhead(){
  const len=winEnd-winStart;
  const ph=document.getElementById('playhead');
  const t = (scrubTime!==null) ? scrubTime : audio.currentTime;
  let x=(t-winStart)/len;
  x=Math.max(0,Math.min(1,x));
  ph.style.display='block';
  ph.style.left=(x*100)+'%';
  const tc=document.getElementById('tCur');
  if(tc) tc.textContent=(isFinite(t)?t:0).toFixed(2);
}

document.getElementById('prev').onclick=()=>{ const k=ORDER.indexOf(cur); if(k>0) load(ORDER[k-1]); };
document.getElementById('next').onclick=()=>{ const k=ORDER.indexOf(cur); if(k<ORDER.length-1) load(ORDER[k+1]); };
document.getElementById('resetOne').onclick=()=>{ delete userStart[cur]; delete userEnd[cur]; edited.delete(cur); recompute(); load(cur); setStatus('已重置 idx '+cur+' 为默认（原长+5秒）。'); };
document.getElementById('backCh').onclick=()=>{ location.href = location.pathname||'/annotate3.html'; };

document.querySelectorAll('.fine button').forEach(b=>{
  b.onclick=()=>{
    const d=parseFloat(b.dataset.d);
    const e0=(userEnd[cur]!==undefined)?userEnd[cur]:bounds[cur][0]+durOf(cur);
    userEnd[cur]=Math.max(bounds[cur][0]+0.1, e0+d);
    recompute();
    if(bounds[cur][1]>winEnd) winEnd=bounds[cur][1]+2;
    renderMarks();
    document.getElementById('tEnd').textContent=bounds[cur][1].toFixed(2);
    edited.add(cur); refreshActive();
    setStatus('终点微调 '+(d>0?'+':'')+d+'s → '+userEnd[cur].toFixed(2)+'s（后续起点已联动）。');
  };
});

async function submitCurrent(){
  const [s,e]=bounds[cur];
  try{
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),15000);
    const r=await fetch(BASE+'/saveOne?ch='+CH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({idx:cur,seg:[s,e]}),signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'未知错误');
    submitted.add(cur); edited.delete(cur); refreshActive();
    return j;
  }catch(err){ return {ok:false, error:err.message}; }
}
document.getElementById('submitOne').onclick=async ()=>{
  const [s,e]=bounds[cur];
  const j=await submitCurrent();
  const msg=j.ok?('✅ 已提交 idx '+cur+' ['+s.toFixed(2)+', '+e.toFixed(2)+'] 并存盘')
                :('❌ 提交失败：'+(j.error||'未知错误')+'（请确认标注服务器在运行：node app/annotate_server.js）');
  setStatus(msg, j.ok?'ok':'err');
};
document.getElementById('submitNext').onclick=async ()=>{
  const [s,e]=bounds[cur];
  const j=await submitCurrent();
  if(j.ok){
    const k=ORDER.indexOf(cur);
    if(k<ORDER.length-1){ load(ORDER[k+1]); setStatus('✅ 已提交 idx '+cur+'，跳到下一句 '+ORDER[k+1],'ok'); }
    else setStatus('✅ 已提交 idx '+cur+'（已是最后一句）','ok');
  } else setStatus('❌ 提交失败：'+(j.error||'未知错误')+'（请确认标注服务器在运行：node app/annotate_server.js）','err');
};

document.getElementById('save').onclick=async ()=>{
  setStatus('⏳ 正在保存全部边界…');
  try{
    const out={};
    for(const i of ORDER) out[i]=bounds[i].map(x=>+x.toFixed(3));
    const ctrl=new AbortController();
    const timer=setTimeout(()=>ctrl.abort(),20000);
    const r=await fetch(BASE+'/saveBounds?ch='+CH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bounds:out}),signal:ctrl.signal});
    clearTimeout(timer);
    if(!r.ok) throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.ok) throw new Error(j.error||'未知错误');
    for(const i of ORDER) submitted.add(i);
    refreshActive();
    setStatus('✅ 已保存全部 '+j.count+' 句边界到 ch'+CH+'_bounds.json','ok');
  }catch(err){
    setStatus('❌ 保存全部边界失败：'+err.message+'（请确认标注服务器在运行：node app/annotate_server.js）','err');
  }
};

document.addEventListener('keydown',e=>{
  if(e.code==='Space' && e.target.tagName!=='INPUT'){ e.preventDefault(); togglePlay(); }
});

trackEl.addEventListener('pointerdown', ev=>{
  const id = ev.target && ev.target.id;
  if(id==='startMark'){ ev.preventDefault(); beginDrag('start'); }
  else if(id==='endMark'){ ev.preventDefault(); beginDrag('end'); }
  else { ev.preventDefault(); beginScrub(); const t=clientXToTime(ev.clientX); scrubTime=t; if(isFinite(audio.duration)&&audio.duration>0) audio.currentTime=t; updatePlayhead(); }
});

// 启动
if(CH){ boot(); } else { showPicker(); }
</script>
</body>
</html>
