<style>

  .bar button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .stat{font-size:13px;color:var(--muted);margin-left:auto}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:14px;padding:18px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}

  .card .body{padding:10px 12px;font-size:13px;line-height:1.5}
  .pali{color:var(--muted);font-style:italic;font-size:12px;word-break:break-word;margin-bottom:4px}

  .b-regen{background:#fbe9d6;color:#a05a18}
  .b-keep{background:#e6efe3;color:#3f7a3a}
  .idx{float:right;color:#bbb;font-size:11px}
  .redraw{margin-top:8px;width:100%;border:1px solid var(--accent);background:#fff;color:var(--accent);
          border-radius:8px;padding:7px;cursor:pointer;font-size:13px}
  .redraw:hover{background:var(--accent);color:#fff}
  .redraw.busy{opacity:.6;pointer-events:none}
  /* 弹窗 */
  .mask{position:fixed;inset:0;background:rgba(40,34,24,.45);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
  .mask.show{display:flex}

  .modal .m-idx{color:#bbb;font-size:12px;margin-bottom:10px}
  .modal .m-zh{background:#f7f3ea;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin-bottom:12px}
  .modal label{font-size:13px;color:var(--muted);display:block;margin-bottom:6px}
  .modal textarea{width:100%;min-height:84px;border:1px solid var(--line);border-radius:8px;padding:10px;
                  font-size:14px;font-family:inherit;resize:vertical}
  .modal .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .modal .acts{display:flex;gap:10px;margin-top:14px;justify-content:flex-end}
  .modal .acts button{padding:8px 16px;border-radius:8px;cursor:pointer;font-size:14px;border:1px solid var(--line)}
  .modal .go{background:var(--accent);color:#fff;border-color:var(--accent)}
  .modal .go.busy{opacity:.6;pointer-events:none}
  .modal .msg{margin-top:10px;font-size:13px;display:none}
  .modal .msg.err{color:#b3402a}
  .modal .msg.ok{color:var(--accent2)}
  .modal pre{white-space:pre-wrap;background:#f7f3ea;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;max-height:160px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>巴帝摩卡 助记图复核 · 可重画</h1>

  </div>
</header>
<main class="grid" id="grid"></main>

<!-- 重画弹窗 -->
<div class="mask" id="mask">

    <div class="m-idx" id="m-idx"></div>
    <div class="m-zh" id="m-zh"></div>
    <label for="m-prompt">你的补充提示词（可留空＝仅按原中文重画）</label>
    <textarea id="m-prompt" placeholder="例如：画面更简洁、突出人物双手、用清晨光线、不要太多元素…"></textarea>
    <div class="hint">原中文含义已自动带入，你的提示词会附加在其后。</div>
    <div class="msg" id="m-msg"></div>
    <div class="acts">
      <button onclick="closeModal()">取消</button>
      <button class="go" id="m-go" onclick="submitRedraw()">确认重画</button>
    </div>
  </div>
</div>

var REGC = 454, KEEPC = 510;
var filter = 'all';
var cur = null; // 当前弹窗对应的 row

function setF(f,btn){filter=f;document.querySelectorAll('.bar button').forEach(b=>b.classList.remove('on'));btn.classList.add('on');apply();}
function apply(){
  var q=(document.getElementById('q').value||'').toLowerCase().trim();
  var g=document.getElementById('grid'); g.innerHTML='';
  var n=0;
  ROWS.forEach(function(r){
    if(filter==='re'&&!r.regen)return;
    if(filter==='keep'&&r.regen)return;
    if(q && (r.pali.toLowerCase().indexOf(q)<0) && (r.zh.toLowerCase().indexOf(q)<0))return;
    n++;
    var c=document.createElement('div');c.className='card';
    var img=document.createElement('img');img.className='img';img.loading='lazy';img.id='img-'+r.idx;
    img.src=r.img;img.alt=r.pali;
    var b=document.createElement('div');b.className='body';
    var idx=document.createElement('span');idx.className='idx';idx.textContent='#'+(r.idx!=null?r.idx:'?');
    var p=document.createElement('div');p.className='pali';p.textContent=r.pali;
    var z=document.createElement('div');z.className='zh';z.textContent=r.zh||'(无中文)';
    var bd=document.createElement('span');bd.className='badge '+(r.regen?'b-regen':'b-keep');bd.textContent=r.regen?'重画':'保留';
    var btn=document.createElement('button');btn.className='redraw';btn.textContent='重画';
    btn.onclick=function(){openModal(r);};
    b.appendChild(idx);b.appendChild(p);b.appendChild(z);b.appendChild(bd);b.appendChild(btn);
    c.appendChild(img);c.appendChild(b);g.appendChild(c);
  });
  document.getElementById('stat').textContent='显示 '+n+' / '+ROWS.length+' 张';
}

function openModal(r){
  cur=r;
  document.getElementById('m-idx').textContent='#'+r.idx+'  ·  '+r.pali;
  document.getElementById('m-zh').textContent=r.zh||'(无中文)';
  document.getElementById('m-prompt').value='';
  var msg=document.getElementById('m-msg');msg.className='msg';msg.style.display='none';msg.textContent='';
  document.getElementById('m-go').classList.remove('busy');
  document.getElementById('mask').classList.add('show');
}
function closeModal(){document.getElementById('mask').classList.remove('show');cur=null;}

function submitRedraw(){
  if(!cur)return;
  var prompt=document.getElementById('m-prompt').value;
  var go=document.getElementById('m-go');go.classList.add('busy');go.textContent='生成中…';
  var msg=document.getElementById('m-msg');msg.className='msg';msg.style.display='none';
  fetch('/api/redraw',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({idx:cur.idx, zh:cur.zh, pali:cur.pali, prompt:prompt})})
   .then(function(res){return res.json();})
   .then(function(d){
     go.classList.remove('busy');go.textContent='确认重画';
     if(d.ok){
       msg.className='msg ok';msg.style.display='block';msg.textContent='✓ 已重新生成，图片已更新';
       var im=document.getElementById('img-'+cur.idx);
       if(im) im.src=cur.img+'?t='+Date.now();
       cur.regen=true;
       setTimeout(closeModal,1200);
     } else if(d.err==='NO_KEY'){
       msg.className='msg err';msg.style.display='block';
       msg.innerHTML='后端未配置 API Key，无法实时生成。已记录请求，请把下面内容复制发给我，我来批量重画：<pre>'+
         escapeHtml(JSON.stringify({idx:cur.idx,zh:cur.zh,prompt:prompt},null,1))+'</pre>';
     } else {
       msg.className='msg err';msg.style.display='block';msg.textContent='✗ 失败：'+(d.err||'未知错误');
     }
   })
   .catch(function(e){
     go.classList.remove('busy');go.textContent='确认重画';
     msg.className='msg err';msg.style.display='block';msg.textContent='✗ 请求出错：'+e;
   });
}
function escapeHtml(s){return s.replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}

apply();
</script>
